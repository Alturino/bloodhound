app:
  name: bloodhound
  environment: development # production, development
  log_level: info # debug, info, error
  idx:
    base_url: https://idx.co.id/primary/ListedCompany/GetAnnouncement
    page_size: 10

database:
  host: localhost
  port: 5432
  user: postgres
  password: postgres
  dbname: bloodhound
  sslmode: disable

minio:
  endpoint: localhost:9000
  access_key: minioadmin
  secret_key: minioadmin
  bucket: bloodhound
  use_ssl: false

scheduler:
  interval: 15m
  cron_expr: "*/15 * * * *"

telemetry:
  enabled: true
  otlp_endpoint: "otlp"
  service_name: bloodhound
