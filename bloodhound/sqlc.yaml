version: "2"
sql:
  - engine: "postgresql"
    queries: "./queries/*.sql"
    schema: "./migrations/*.sql"
    gen:
      go:
        package: "sql"
        sql_package: "pgx/v5"
        out: "./internal/db/.gen/"
        emit_db_tags: true
        emit_interface: true
        emit_json_tags: true
        emit_prepared_queries: true
        emit_exact_table_names: true
        emit_pointers_for_null_types: true
        emit_all_enum_values: true
        emit_enum_valid_method: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
