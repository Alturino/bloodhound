app:
  name: bloodhound
  enabled: true
  environment: production
  log_level: 0
  log_dir: ./logs/
  idx:
    base_url: https://idx.co.id
    page_size: 1000
    scheduler:
      interval: 30s
      cron_expr: "*/15 * * * *"
    worker_pool:
      announcement_workers: 5
      attachment_workers: 15
  stockbit:
    base_url: https://exodus.stockbit.com
    token: ""

database:
  host: localhost
  port: 5432
  user: bloodhound
  password: bloodhound
  dbname: bloodhound
  sslmode: disable
  migration_path: file://migrations

storage:
  local:
    enabled: true
    bloodhound_dir: /run/media/onirutla/External1/bloodhound/local
  minio:
    enabled: false
    endpoint: localhost:9000
    access_key: minioadmin
    secret_key: minioadmin
    bucket: bloodhound
    use_ssl: false

telemetry:
  file_format: "0.3"
  disabled: false
  resource:
    attributes:
      - name: service.name
        value: "${OTEL_SERVICE_NAME}"
      - name: deployment.environment
        value: "${OTEL_ENVIRONMENT}"
  tracer_provider:
    processors:
      - batch:
          exporter:
            otlp_grpc:
              endpoint: "${OTEL_TRACES_ENDPOINT}"
              insecure: true
  meter_provider:
    readers:
      - periodic:
          interval: 5000
          exporter:
            otlp_grpc:
              endpoint: "${OTEL_METRICS_ENDPOINT}"
              insecure: true
              compression: gzip
      - pull:
          exporter:
            prometheus/development:
              host: localhost
              port: 9091
  propagator:
    composite:
      - tracecontext: {}
      - baggage: {}
      - jaeger: {}
