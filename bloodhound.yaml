app:
  name: bloodhound
  environment: development
  log_level: 0
  log_dir: ./logs/
  idx:
    base_url: https://idx.co.id
    page_size: 10
    mock_mode: false
  stockbit:
    base_url: https://exodus.stockbit.com
    token: ""

database:
  host: localhost
  port: 5432
  user: postgres
  password: postgres
  dbname: bloodhound
  sslmode: disable
  migration_path: file://migrations

minio:
  endpoint: localhost:9000
  access_key: minioadmin
  secret_key: minioadmin
  bucket: bloodhound
  use_ssl: false

scheduler:
  interval: 15m
  cron_expr: "*/15 * * * *"

telemetry:
  enabled: true
  service_name: bloodhound
