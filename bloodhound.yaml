app:
  name: bloodhound
  environment: development
  log_level: -4
  log_dir: ./logs/
  idx:
    base_url: https://idx.co.id
    page_size: 1000
    worker_pool:
      announcement_workers: 3
      attachment_workers: 5
  stockbit:
    base_url: https://exodus.stockbit.com
    token: ""

database:
  host: localhost
  port: 5432
  user: "postgres"
  password: "postgres"
  dbname: "bloodhound"
  sslmode: disable
  migration_path: file://migrations

storage:
  local:
    enabled: true
    bloodhound_dir: /run/media/onirutla/Backup/bloodhound/local/
  minio:
    endpoint: localhost:9000
    access_key: minioadmin
    secret_key: minioadmin
    bucket: bloodhound
    use_ssl: false

scheduler:
  interval: 5s
  cron_expr: "*/15 * * * *"

telemetry:
  enabled: true
  otlp_traces_endpoint: "localhost:4317"
  otlp_metrics_endpoint: "localhost:4318"
  prometheus_endpoint: ":9091"
  service_name: bloodhound
