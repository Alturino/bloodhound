app:
  name: bloodhound
  environment: production
  log_level: 0
  log_dir: ./logs/
  idx:
    base_url: https://idx.co.id
    page_size: 1000
    scheduler:
      interval: 30s
      cron_expr: "*/15 * * * *"
    worker_pool:
      announcement_workers: 5
      attachment_workers: 15
  stockbit:
    base_url: https://exodus.stockbit.com
    token: ""

database:
  host: localhost
  port: 5432
  user: bloodhound
  password: bloodhound
  dbname: bloodhound
  sslmode: disable
  migration_path: file://migrations

storage:
  local:
    enabled: true
    bloodhound_dir: /run/media/onirutla/External1/bloodhound/local
  minio:
    enabled: false
    endpoint: localhost:9000
    access_key: minioadmin
    secret_key: minioadmin
    bucket: bloodhound
    use_ssl: false

telemetry:
  enabled: true
  otlp_traces_endpoint: "localhost:4317"
  otlp_metrics_endpoint: "localhost:4318"
  prometheus_endpoint: ":9091"
  service_name: bloodhound
