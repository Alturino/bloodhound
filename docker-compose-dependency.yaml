# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-go/master/schema/compose-spec.json
services:
  postgres:
    image: postgres:18.4-trixie
    environment:
      TZ: "Asia/Jakarta"
      PGTZ: "Asia/Jakarta"
    env_file:
      - ./.env
    ports:
      - ${POSTGRES_PORT:-5432}:${POSTGRES_PORT:-5432}
    healthcheck:
      test:
        ["CMD", "pg_isready", "-d", "${POSTGRES_DB}", "-U", "${POSTGRES_USER}"]
      interval: 25s
      timeout: 15s
      retries: 5
      start_period: 10s
    volumes:
      # - postgres:/var/lib/postgresql/
      - /run/media/onirutla/External1/bloodhound/postgresql:/var/lib/postgresql/
      - ./pg_conf/pg_hba.conf:/var/lib/postgresql/18/docker/pg_hba.conf
      - ./pg_conf/postgresql.conf:/var/lib/postgresql/18/docker/postgresql.conf
      - ./db_init:/docker-entrypoint-initdb.d:ro
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.19.0
    env_file:
      - .env
    environment:
      - DATA_SOURCE_NAME=${POSTGRES_URL}
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 9187:9187
